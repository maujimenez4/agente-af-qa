# Contrato de la API (T-55). GENERADO: no editar a mano.
# Regenerar con: uv run python -m api.export_openapi
openapi: 3.1.0
info:
  title: Agente de IA de Análisis Funcional y QA
  description: API para el frontend propio (T-55). Sesión con cookie HttpOnly `afqa_session` y cabecera
    `X-CSRF-Token` en las peticiones que modifican algo.
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Sesión
      summary: Iniciar sesión
      description: Crea la cookie de sesión HttpOnly y devuelve el usuario y el token anti-CSRF.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
              example:
                user:
                  username: af-demo
                  role: functional
                  permissions:
                  - view_context
                  - generate_story
                  - publish_story
                  - view_memory
                csrf_token: csrf-token-ficticio-0123456789abcdef
        '401':
          description: Credenciales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_credentials
                  message: Usuario o contraseña incorrectos.
        '429':
          description: Intentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: too_many_attempts
                  message: Demasiados intentos; espera unos minutos.
        '422':
          description: Petición no válida (sin devolver lo enviado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: 'La petición no es válida: revisa password.'
                  retry_after: null
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Sesión
      summary: Cerrar sesión
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: Sin sesión o caducada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthenticated
                  message: Inicia sesión para continuar.
        '403':
          description: Sin permiso para el rol, o sin cabecera `X-CSRF-Token` válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: forbidden
                  message: No tienes permiso para realizar esta acción.
  /api/v1/auth/me:
    get:
      tags:
      - Sesión
      summary: Sesión actual
      description: 'Al recargar la página: usuario y un token anti-CSRF nuevo.'
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
              example:
                user:
