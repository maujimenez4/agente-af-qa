[project]
name = "agente-af-qa"
version = "0.1.0"
description = "Agente de IA de Análisis Funcional y QA (MVP)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "docling>=2.131.0",
    "fastapi>=0.118,<0.142",
    "httpx>=0.28.1",
    "langfuse==4.15.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp>=2.2,<2.3",
    "openai>=3.22.1",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn>=0.30,<0.55",
]

[dependency-groups]
dev = [
    "faker>=40.40.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false
# PA-323 (T-59): cuarentena de una semana para las dependencias que trae `mcp`; sus últimas
# versiones son de hace menos de 7 días. Se pueden quitar a partir del 2026-10-08.
# Excepción: una versión en cuarentena se acepta si corrige vulnerabilidades (`cryptography`
# 50.0.2 lleva OpenSSL 4.0.3, versión de seguridad; ver PA-323).
# PA-294 (T-40): cuarentena de la transitiva de `langfuse` googleapis-common-protos 1.75.5
# (2026-09-29); se puede quitar a partir del 2026-10-07.
constraint-dependencies = ["pyjwt<2.15.1", "sse-starlette<3.5", "googleapis-common-protos<1.75.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
# PA-425: si una prueba se cuelga, a los 5 min vuelca la traza de todos los hilos (no la aborta).
faulthandler_timeout = 300
markers = [
    "integration: pruebas contra servicios reales (Jira, LLM, PostgreSQL); se saltan si faltan credenciales",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes y signos

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999"]

[tool.ruff.format]
quote-style = "double"
exclude = ["**/*.md"]

# torch (dependencia de docling) solo CPU: sin librerías CUDA en CI ni en local (R-08).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
