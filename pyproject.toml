[project]
name = "agente-af-qa"
version = "0.1.0"
description = "Agente de IA de Análisis Funcional y QA (MVP)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "docling>=2.131.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=3.22.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[dependency-groups]
dev = [
    "faker>=40.40.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: pruebas contra servicios reales (Jira, LLM, PostgreSQL); se saltan si faltan credenciales",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes y signos

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999"]

[tool.ruff.format]
quote-style = "double"
exclude = ["**/*.md"]

# torch (dependencia de docling) solo CPU: sin librerías CUDA en CI ni en local (R-08).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
