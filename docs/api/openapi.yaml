                  role: functional
                  permissions:
                  - view_context
                  - generate_story
                  - publish_story
                  - view_memory
                csrf_token: csrf-token-ficticio-0123456789abcdef
        '401':
          description: Sin sesión o caducada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthenticated
                  message: Inicia sesión para continuar.
      security:
      - sessionCookie: []
