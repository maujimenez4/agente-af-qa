services:
  db:
    # PA-231: fijada por digest a la imagen en uso (PostgreSQL 16.15 con pgvector), consultada el
    # 2026-10-04 con `docker image inspect`; la última publicada de pg16 ya es otra. Para
    # actualizar: `docker buildx imagetools inspect pgvector/pgvector:pg16`.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"        # solo en esta máquina (se aplica al recrear)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  ollama:
    # PA-231: fijada por digest a la imagen en uso (Ollama 0.35.0, con la que pasó el e2e),
    # consultada el 2026-10-04 con `docker image inspect`; la última publicada ya es otra.
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    profiles: ["local-llm"]      # docker compose --profile local-llm up -d
    environment:
      OLLAMA_CONTEXT_LENGTH: "10240"  # PA-440 · instrucciones + contexto + salida (ver limits en models.yaml)
      # PA-275: el modelo sigue cargado tras la última llamada (la app no envía keep_alive).
      # 30 min y no 2 h: con 2 h la memoria no se libera y hubo OOM en el e2e (2026-10-02).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Como mucho dos modelos a la vez (principal + embeddings): si entra el respaldo,
      # Ollama descarga uno en vez de quedarse sin memoria. Se aplica al recrear el contenedor.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    ports:
      - "127.0.0.1:11434:11434"      # solo en esta máquina (se aplica al recrear)
    volumes:
      - ollama:/root/.ollama

  # PA-273: la API (python -m api) en un contenedor, para quien no puede instalar Python.
  # docker compose --profile full up -d app  (ver README, «API en Docker»)
  app:
    build: .
    profiles: ["full"]
    env_file: .env                   # Jira y el resto, en tiempo de ejecución (nunca en la imagen)
    environment:
      # Dentro de la red de Compose: los servicios db y ollama, no localhost. La URL de la base
      # de datos la compone la app con POSTGRES_HOST y el resto de POSTGRES_* del .env (PA-278):
      # la contraseña no pasa por una URL escrita aquí y sus caracteres especiales se codifican.
      # DATABASE_URL vacía anula la del .env, que apunta a 127.0.0.1 (fuera de Compose).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: ""
      OLLAMA_BASE_URL: http://ollama:11434/v1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"        # solo en esta máquina

volumes:
  pgdata:
  ollama:
