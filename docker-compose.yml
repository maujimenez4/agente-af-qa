services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    profiles: ["local-llm"]      # docker compose --profile local-llm up -d
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"   # 6000 de contexto RAG + instrucciones + salida
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  app:
    build: .
    profiles: ["full"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  pgdata:
  ollama:
