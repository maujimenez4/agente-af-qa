    post:
      tags:
      - Revisar la calidad
      summary: Revisar la calidad de una HU (T-48, no publica)
      operationId: create_quality_review_api_v1_quality_reviews_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityReviewIn'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityReviewOut'
              example:
                id: b2d4f6a8-1c3e-4f5a-8b9c-0d1e2f3a4b5c
                issue_key: DEMO-3
                state: done
                report:
                  summary: La HU es valiosa y pequeña; hay un criterio ambiguo y un hueco (ficticio).
                  invest:
                  - letter: I
                    verdict: ok
                    reason: Motivo ficticio de I.
                  - letter: N
                    verdict: ok
                    reason: Motivo ficticio de N.
                  - letter: V
                    verdict: ok
                    reason: Motivo ficticio de V.
                  - letter: E
                    verdict: ok
                    reason: Motivo ficticio de E.
                  - letter: S
                    verdict: ok
                    reason: Motivo ficticio de S.
                  - letter: T
                    verdict: improvable
                    reason: Motivo ficticio de T.
                  findings:
                  - kind: ambiguity
                    target_id: CA-02
                    explanation: «Avisar pronto» no se puede probar.
                    proposal: Avisar en menos de 15 minutos.
