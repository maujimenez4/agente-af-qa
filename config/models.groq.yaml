# PLAN B · TODO GROQ (PA-443). Asignación de modelos por tarea (RF-41) · D-14: solo modelos
# open-weight gratuitos (`openai/gpt-oss-*` en el nivel gratuito de Groq).
# Activar: MODELS_CONFIG_PATH=config/models.groq.yaml en el .env, con GROQ_API_KEY (ver
# config/README.md). Todas las tareas con Groq y respaldo LOCAL (qwen3:1.7b, Ollama).
# PA-441 (2026-10-07): la cadena anterior ya no sirve: `qwen/qwen3.8-27b` en Groq admite solo
# 1000 tokens de salida por minuto y OpenRouter ya no tiene versión gratuita (404).
# Límite del nivel gratuito de gpt-oss-120b: 8000 tokens por minuto (entrada + salida prevista).
# La suite de QA solo cabe con poco contexto y tope de salida, y su iteración no cabe (413 → pasa
# al respaldo local). Por eso la configuración por defecto es la mixta (config/models.yaml).
# Sin secretos: solo el nombre de la variable de entorno.
providers:
  groq:
    type: openai_compatible
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: GROQ_API_KEY
    # Contexto de 2000 (PA-441: con 1500 se recortaba la HU de origen antes de PA-442).
    # Tope de salida solo en la suite: con 2500 y contexto 2000, ~7800 de los 8000 TPM.
    limits:
      context_window: 131072
      context_token_budget: 2000
      max_output_tokens:
        generate_tests: 2500
      max_wait_s: 60
      max_retries_on_429: 2
      request_timeout_s: 120
  local:
    type: openai_compatible
    base_url: "http://127.0.0.1:11434/v1"
    api_key_env: null
    limits:
      context_window: 10240
      context_token_budget: 3300
      request_timeout_s: 900
      max_output_tokens:
        generate_story: 2500
        evolve_story: 2500
        review_story: 2000
        generate_tests: 2500
        analyze_impact: 800
        synthesize_memory: 1200
        classify_source: 200
        nl_to_jql: 200

tasks:
  # Pesadas: gpt-oss-120b con razonamiento «low».
  generate_story:    [ { provider: groq, model: "openai/gpt-oss-120b", options: { reasoning_effort: "low" } }, { provider: local, model: "qwen3:1.7b", options: { reasoning_effort: "none" } } ]
  evolve_story:      [ { provider: groq, model: "openai/gpt-oss-120b", options: { reasoning_effort: "low" } }, { provider: local, model: "qwen3:1.7b", options: { reasoning_effort: "none" } } ]
  review_story:      [ { provider: groq, model: "openai/gpt-oss-120b", options: { reasoning_effort: "low" } }, { provider: local, model: "qwen3:1.7b", options: { reasoning_effort: "none" } } ]
  generate_tests:    [ { provider: groq, model: "openai/gpt-oss-120b", options: { reasoning_effort: "low" } }, { provider: local, model: "qwen3:1.7b", options: { reasoning_effort: "none" } } ]
  # Medias y ligeras: gpt-oss-20b.
  analyze_impact:    [ { provider: groq, model: "openai/gpt-oss-20b" }, { provider: local, model: "qwen3:1.7b", options: { reasoning_effort: "none" } } ]
  synthesize_memory: [ { provider: groq, model: "openai/gpt-oss-20b" }, { provider: local, model: "qwen3:1.7b", options: { reasoning_effort: "none" } } ]
  classify_source:   [ { provider: groq, model: "openai/gpt-oss-20b" }, { provider: local, model: "qwen3:1.7b", options: { reasoning_effort: "none" } } ]
  nl_to_jql:         [ { provider: groq, model: "openai/gpt-oss-20b" }, { provider: local, model: "qwen3:1.7b", options: { reasoning_effort: "none" } } ]

embeddings: { provider: local, model: "bge-m3", dimensions: 1024 }

limits:
  max_retries_on_429: 2
  context_token_budget: 2000
  context_window: 131072
  daily_token_warning: 180000     # aviso en la UI antes de agotar el nivel gratuito de Groq
  request_timeout_s: 120
  max_wait_s: 60
  max_output_tokens:
    generate_tests: 2500

rag:
  chunk_tokens: 650
  overlap_tokens: 80
  top_k: 6
  memory_boost: 1.3               # RF-51
