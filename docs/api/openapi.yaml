                  artifact_type: user_story
                  jira_key: DEMO-9001
                  version: 2
                  objective: 'Ejemplo ficticio: permitir a una persona socia renovar un préstamo desde
                    la web de la Biblioteca de Villaficticia sin pasar por el mostrador.'
                  scope: 'Memoria de ejemplo FICTICIA (Biblioteca Municipal de Villaficticia): no es una
                    HU real. Incluye la renovación desde «Mis préstamos»; no incluye pagos.'
                  business_rules:
                  - 'RN-1: un préstamo se renueva como máximo dos veces.'
