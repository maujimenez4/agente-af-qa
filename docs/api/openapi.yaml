                - 'CA-02: Avisar en menos de 15 minutos.'
                - Añadir un criterio de error.
                report_markdown: '# Calidad de DEMO-3


                  La HU es valiosa y pequeña; hay un criterio ambiguo y un hueco \(ficticio\).


                  ## INVEST


                  - **I · Independiente**: Bien. Motivo ficticio de I.

                  - **N · Negociable**: Bien. Motivo ficticio de N.

                  - **V · Valiosa**: Bien. Motivo ficticio de V.

                  - **E · Estimable**: Bien. Motivo ficticio de E.

                  - **S · Pequeña**: Bien. Motivo ficticio de S.

                  - **T · Testeable**: Mejorable. Motivo ficticio de T.


                  ## Hallazgos


                  - **Ambigüedad · CA-02**: «Avisar pronto» no se puede probar. Propuesta: Avisar en menos
                  de 15 minutos.

                  - **Hueco**: No dice qué pasa si la renovación falla. Propuesta: Añadir un criterio
                  de error.


                  ## Preguntas para negocio


                  - ¿Hay un máximo de renovaciones por año? \(ficticio\)


                  ## Fuentes


                  - DOC-01

