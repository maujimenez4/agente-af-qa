<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carril de navegación</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.qi{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.nav{width:72px;min-height:60px;border:0;border-radius:12px;background:transparent;color:#C9D2DB;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;transition:background .22s cubic-bezier(.2,.7,.2,1),color .22s cubic-bezier(.2,.7,.2,1)}
.nav:hover{background:#2C3E4D;color:#FFFFFF}
.nav.on{background:#2C3E4D;color:#FFFFFF;font-weight:700}
.nav.on .qi{color:#FF7932}
.ico{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#C9D2DB;display:flex;align-items:center;justify-content:center}
.ico:hover{background:#2C3E4D;color:#FFFFFF}
@media (prefers-reduced-motion: reduce){.nav{transition:none}}
</style>
</helmet>
<nav aria-label="Zonas" style="width: 88px; height: 800px; box-sizing: border-box; padding: 18px 8px 16px; background: #1E2D3D; display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: 'DM Sans', system-ui, sans-serif;">
<svg role="img" aria-label="Qaracter" viewBox="0 0 326 326" width="34" height="34" style="margin-bottom: 18px;"><path d="M110.806 87.9929H215.094C227.693 87.9929 237.907 98.2067 237.907 110.806V168.557C230.545 167.016 222.914 166.206 215.095 166.206H166.21V237.904H215.095C236.693 237.904 254.203 255.413 254.203 277.012V325.898H325.901V277.012C325.901 225.051 290.135 181.444 241.879 169.465H325.9V110.806C325.9 49.6095 276.29 0 215.094 0H110.806C49.6095 0 0 49.6095 0 110.806V215.094C0 276.29 49.6095 325.9 110.806 325.9L166.21 325.897V237.907H110.806C98.2067 237.907 87.9929 227.693 87.9929 215.094V110.806C87.9929 98.2067 98.2067 87.9929 110.806 87.9929Z" fill="#FF7932"></path></svg>
<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<a href="#" class="{{it.cls}}" aria-current="{{it.current}}"><svg class="qi" viewBox="0 0 24 24" aria-hidden="true"><path d="{{it.d}}"></path></svg><span>{{it.label}}</span></a>
</sc-for>
<div style="flex-grow: 1;"></div>
<div role="img" aria-label="{{usageLabel}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #C9D2DB; font-size: 11px;">
<svg viewBox="0 0 36 36" width="36" height="36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="#2C3E4D" stroke-width="4"></circle><circle cx="18" cy="18" r="15" fill="none" stroke="{{usageColor}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="{{usageDash}}" transform="rotate(-90 18 18)"></circle></svg>
<span>{{usagePct}} tokens</span>
</div>
<div aria-label="{{userLabel}}" role="img" style="margin-top: 8px; width: 40px; height: 40px; border-radius: 12px 12px 4px 12px; background: #FFF3EC; color: #B23E00; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{initial}}</div>
<button class="ico" aria-label="Cerrar sesión"><svg class="qi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21H9a6 6 0 0 1-6-6V9a6 6 0 0 1 6-6h3 M16 8l4 4-4 4 M20 12H10"></path></svg></button>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["trabajo","historial","admin"],"default":"trabajo"},"role":{"editor":"enum","options":["functional","qa","admin"],"default":"functional"},"$preview":{"width":88,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'trabajo';
const role = this.props.role ?? 'functional';
const tile = 'M3 9a6 6 0 0 1 6-6h6a6 6 0 0 1 6 6v12H9a6 6 0 0 1-6-6z';
const all = [
{ id: 'trabajo', label: 'Trabajo', d: tile + ' M8 10h8 M8 14h5', roles: ['functional', 'qa'] },
{ id: 'historial', label: 'Historial', d: tile + ' M12 8v4l2.5 2', roles: ['functional', 'qa', 'admin'] },
{ id: 'admin', label: 'Ajustes', d: tile + ' M8 10h8 M8 14h8 M10.5 8.5v3 M13.5 12.5v3', roles: ['admin'] },
];
const items = all.filter((i) => i.roles.includes(role)).map((i) => ({
...i,
cls: i.id === active ? 'nav on' : 'nav',
current: i.id === active ? 'page' : 'false',
}));
const user = { functional: ['af-demo', 'Analista funcional', 24], qa: ['qa-demo', 'QA', 95], admin: ['admin-demo', 'Administrador', 2] }[role];
const pct = user[2];
const c = 2 * Math.PI * 15;
return {
items,
initial: user[0].charAt(0).toUpperCase(),
userLabel: user[0] + ', ' + user[1],
usagePct: pct + ' %',
usageLabel: 'Consumo diario de tokens: ' + pct + ' %',
usageDash: (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1),
usageColor: pct >= 90 ? '#FFB48A' : '#FF7932',
};
}
}
</script>
</body>
</html>
