# Asignación de modelos por tarea (RF-41) · D-14: solo modelos open-weight gratuitos.
# Desde el 2026-10-01 (decisión del usuario) solo se usan modelos LOCALES de Ollama en Docker: sin
# cuota de Groq ni OpenRouter. La variante con Groq/OpenRouter está en config/models.groq.yaml
# (activar con MODELS_CONFIG_PATH en el .env).
# Levantar: docker compose --profile local-llm up -d ollama
#           docker compose exec ollama ollama pull bge-m3
#           docker compose exec ollama ollama pull qwen3:4b-instruct
# Modelo generador: qwen3:4b-instruct (Q4, 2,5 GB; ~4 GB de RAM con 8192 de contexto, solo CPU).
# Sin respaldo en la nube: si Ollama no responde, la tarea falla (no se gasta cuota).
# Ventana de contexto: OLLAMA_CONTEXT_LENGTH=8192 en el servicio `ollama` de docker-compose.yml.
# Cada tarea es una CADENA ordenada (RF-44); cambiar de proveedor = añadirlo en `providers`.
# Sin secretos: solo el nombre de la variable de entorno.
providers:
  local:      { type: openai_compatible, base_url: "http://localhost:11434/v1",      api_key_env: null }

tasks:
  # Pesadas.
  generate_story:    [ { provider: local, model: "qwen3:4b-instruct" } ]
  evolve_story:      [ { provider: local, model: "qwen3:4b-instruct" } ]
  review_story:      [ { provider: local, model: "qwen3:4b-instruct" } ]
  generate_tests:    [ { provider: local, model: "qwen3:4b-instruct" } ]
  # Medias.
  analyze_impact:    [ { provider: local, model: "qwen3:4b-instruct" } ]
  synthesize_memory: [ { provider: local, model: "qwen3:4b-instruct" } ]
  # Ligeras.
  classify_source:   [ { provider: local, model: "qwen3:4b-instruct" } ]
  nl_to_jql:         [ { provider: local, model: "qwen3:4b-instruct" } ]

# Sin cambios respecto a models.yaml: cambiar el modelo de embeddings invalidaría el índice del RAG.
embeddings: { provider: local, model: "bge-m3", dimensions: 1024 }

limits:
  max_retries_on_429: 2
  context_token_budget: 6000
  daily_token_warning: 180000     # aviso en la UI antes de agotar el nivel gratuito de Groq
  request_timeout_s: 600          # qwen3:4b en CPU: una HU completa puede pasar de varios minutos
  max_output_tokens:              # tope de salida por tarea (deja sitio al reintento en 8192)
    generate_story: 2500
    evolve_story: 2500
    review_story: 2000
    generate_tests: 3000
    analyze_impact: 800
    synthesize_memory: 1200
    classify_source: 200
    nl_to_jql: 200

rag:
  chunk_tokens: 650
  overlap_tokens: 80
  top_k: 6
  memory_boost: 1.3               # RF-51
